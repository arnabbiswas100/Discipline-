<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>DISCIPLINE — History</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<nav class="nav">
  <div class="nav-inner">
    <span class="nav-logo">⚡ DISCIPLINE</span>
    <div class="nav-links">
      <a href="index.html"      class="nav-link">🏠 <span>Dashboard</span></a>
      <a href="log.html"        class="nav-link">✏️ <span>Log</span></a>
      <a href="history.html"    class="nav-link active">📅 <span>History</span></a>
      <a href="milestones.html" class="nav-link">🏆 <span>Wins</span></a>
      <button id="theme-btn" class="theme-btn">☀️</button>
    </div>
  </div>
</nav>

<main class="page">
<div class="container">

  <h1 class="font-black mb-24" style="font-size:1.8rem">📅 History</h1>

  <!-- Monthly stats bar -->
  <div class="stats-grid mb-32" id="monthly-stats">
    <div class="stat-card card">
      <div class="stat-value" id="h-avg">—</div>
      <div class="stat-label">Month Avg</div>
    </div>
    <div class="stat-card card">
      <div class="stat-value green" id="h-good">—</div>
      <div class="stat-label">Good Days ≥70%</div>
    </div>
    <div class="stat-card card">
      <div class="stat-value" id="h-logged">—</div>
      <div class="stat-label">Days Logged</div>
    </div>
  </div>

  <!-- Calendar -->
  <div class="card" style="padding:28px">
    <div class="cal-header">
      <div class="month-nav">
        <button id="cal-prev">‹</button>
        <span class="month-title" id="cal-title">May 2026</span>
        <button id="cal-next">›</button>
      </div>
      <button class="btn btn-ghost" id="cal-today" style="padding:8px 14px;font-size:0.82rem">Today</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>

</div>
</main>

<!-- Day Detail Modal -->
<div class="modal-overlay" id="day-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-date">—</div>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div id="modal-body"></div>
    <div class="btn-row mt-24">
      <a id="modal-edit-btn" href="#" class="btn btn-primary">✏️ Edit Log</a>
      <button class="modal-close btn btn-ghost" id="modal-close2">Close</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="js/app.js"></script>
<script src="js/history.js"></script>
</body>
</html>
