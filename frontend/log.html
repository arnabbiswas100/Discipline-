<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>DISCIPLINE — Log</title>
  <meta name="description" content="Log and edit daily habits"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<nav class="nav">
  <div class="nav-inner">
    <span class="nav-logo">⚡ DISCIPLINE</span>
    <div class="nav-links">
      <a href="index.html"      class="nav-link">🏠 <span>Dashboard</span></a>
      <a href="log.html"        class="nav-link active">✏️ <span>Log</span></a>
      <a href="history.html"    class="nav-link">📅 <span>History</span></a>
      <a href="milestones.html" class="nav-link">🏆 <span>Wins</span></a>
      <button id="theme-btn" class="theme-btn">☀️</button>
    </div>
  </div>
</nav>

<main class="page">
<div class="container">

  <h1 class="font-black mb-24" style="font-size:1.8rem">✏️ Daily Log</h1>

  <!-- Date Bar -->
  <div class="log-date-bar mb-24">
    <button class="date-nav-btn" id="date-prev" title="Previous day">‹</button>
    <input type="date" class="date-input" id="date-input"/>
    <button class="date-nav-btn" id="date-next" title="Next day">›</button>
    <button class="btn btn-ghost" id="goto-today">Today</button>
  </div>

  <!-- Progress Ring inline -->
  <div class="card" style="padding:24px 28px;margin-bottom:24px;display:flex;align-items:center;gap:24px;flex-wrap:wrap">
    <div class="ring-container" style="width:100px;height:100px">
      <svg width="100" height="100" id="ring-svg">
        <circle class="ring-bg" cx="50" cy="50" r="42"/>
        <circle class="ring-fill" cx="50" cy="50" r="42"/>
      </svg>
      <div class="ring-text">
        <div class="ring-pct" id="ring-pct" style="font-size:1.3rem">0%</div>
      </div>
    </div>
    <div>
      <div id="log-date-display" class="font-bold" style="font-size:1.1rem;margin-bottom:4px">—</div>
      <div id="log-status" class="text-muted text-sm">No log yet for this day</div>
    </div>
  </div>

  <!-- Habits Grid -->
  <div class="section-title">Habits</div>
  <div class="habits-grid mb-24" id="habits-grid"></div>

  <!-- Mood -->
  <div class="section-title">Mood</div>
  <div class="mood-grid mb-24" id="mood-grid">
    <button class="mood-btn" data-mood="🔥">🔥</button>
    <button class="mood-btn" data-mood="😊">😊</button>
    <button class="mood-btn" data-mood="😐">😐</button>
    <button class="mood-btn" data-mood="😔">😔</button>
    <button class="mood-btn" data-mood="😤">😤</button>
    <button class="mood-btn" data-mood="😴">😴</button>
    <button class="mood-btn" data-mood="💪">💪</button>
    <button class="mood-btn" data-mood="🤒">🤒</button>
  </div>

  <!-- Notes -->
  <div class="section-title">Daily Notes</div>
  <textarea class="notes-area mb-24" id="notes-area" placeholder="How was your day? Any reflections…"></textarea>

  <!-- Actions -->
  <div class="btn-row">
    <button class="btn btn-primary" id="save-btn">💾 Save Log</button>
    <button class="btn btn-danger" id="delete-btn" style="display:none">🗑 Delete</button>
    <a href="index.html" class="btn btn-ghost">↩ Dashboard</a>
  </div>

</div>
</main>

<div id="toast-container"></div>
<script src="js/app.js"></script>
<script src="js/log.js"></script>
</body>
</html>
