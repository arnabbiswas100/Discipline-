<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>DISCIPLINE — My Wins</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<nav class="nav">
  <div class="nav-inner">
    <span class="nav-logo">⚡ DISCIPLINE</span>
    <div class="nav-links">
      <a href="index.html"      class="nav-link">🏠 <span>Dashboard</span></a>
      <a href="log.html"        class="nav-link">✏️ <span>Log</span></a>
      <a href="history.html"    class="nav-link">📅 <span>History</span></a>
      <a href="milestones.html" class="nav-link active">🏆 <span>Wins</span></a>
      <button id="theme-btn" class="theme-btn">☀️</button>
    </div>
  </div>
</nav>

<main class="page">
<div class="container">

  <h1 class="font-black mb-8" style="font-size:1.8rem">🏆 My Wins</h1>
  <p class="text-muted mb-32">To count as a day you must complete at least 70% of habits.</p>

  <!-- Next Milestone Progress -->
  <div class="next-milestone mb-32" id="next-milestone-wrap">
    <div class="section-title" style="margin-bottom:8px">Next Milestone</div>
    <div style="display:flex;align-items:baseline;gap:12px">
      <span class="font-black" style="font-size:1.6rem" id="next-days">—</span>
      <span class="text-muted text-sm" id="next-label">days</span>
      <span class="text-dim text-sm" id="next-progress-text" style="margin-left:auto"></span>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="next-progress-fill"></div>
    </div>
  </div>

  <!-- Milestone Cards -->
  <div class="milestones-grid" id="milestones-grid">
    <div class="text-muted">Loading milestones…</div>
  </div>

</div>
</main>

<div id="toast-container"></div>
<script src="js/app.js"></script>
<script src="js/milestones.js"></script>
</body>
</html>
