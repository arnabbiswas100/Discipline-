services:
  - type: web
    name: discipline-dashboard
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: discipline-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: discipline-db
    plan: free
    databaseName: discipline
    user: discipline_user
